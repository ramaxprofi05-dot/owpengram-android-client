name: FemboyGram Android

on:
  push:
    branches: [femboygram]
    paths:
      - '**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Разрешить сборку APK (только после завершения разработки)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: femboygram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FEMBOYGRAM_API_ID: ${{ secrets.FEMBOYGRAM_API_ID }}
      FEMBOYGRAM_API_HASH: ${{ secrets.FEMBOYGRAM_API_HASH }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android compile toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # Compile both actual application variants. APK packaging remains disabled
      # until the explicit release gate is opened.
      - name: Compile FemboyGram and ExteraGram application sources
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppStandalone:compileFemboygramAfatDebugJavaWithJavac \
            :TMessagesProj_AppStandalone:compileExteragramAfatDebugJavaWithJavac

      - name: Compile Extera instrumentation tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppTests:compileAfatDebugAndroidTestJavaWithJavac \
            :TMessagesProj_AppTests:compileAfatDebugAndroidTestKotlin

  build:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FEMBOYGRAM_API_ID: ${{ secrets.FEMBOYGRAM_API_ID }}
      FEMBOYGRAM_API_HASH: ${{ secrets.FEMBOYGRAM_API_HASH }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Assemble both editions
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppStandalone:assembleFemboygramAfatDebug \
            :TMessagesProj_AppStandalone:assembleExteragramAfatDebug

      - name: Stage clearly named APKs
        run: |
          mkdir -p dist
          cp TMessagesProj_AppStandalone/build/outputs/apk/femboygram/afat/debug/app.apk dist/FemboyGram-debug.apk
          cp TMessagesProj_AppStandalone/build/outputs/apk/exteragram/afat/debug/app.apk dist/ExteraGram-debug.apk
          test -s dist/FemboyGram-debug.apk
          test -s dist/ExteraGram-debug.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: femboygram-and-exteragram-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
