name: FemboyGram Android

on:
  push:
    branches: [femboygram]
    paths:
      - '**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: femboygram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build FemboyGram debug APK
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleAfatDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: femboygram-android-debug
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
