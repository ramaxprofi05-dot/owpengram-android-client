name: FemboyGram Android

on:
  push:
    branches: [femboygram]
    paths:
      - '**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [femboygram]
    paths:
      - '**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Разрешить сборку APK (только после завершения разработки)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Each commit gets its own verification run. A slow recursive submodule checkout
# must not hold newer fixes in the same PR in a pending concurrency queue.

jobs:
  verify:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FEMBOYGRAM_API_ID: ${{ secrets.FEMBOYGRAM_API_ID }}
      FEMBOYGRAM_API_HASH: ${{ secrets.FEMBOYGRAM_API_HASH }}
    steps:
      - name: Checkout source for Java verification
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android compile toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # Compile both actual application variants. APK packaging remains disabled
      # until the explicit release gate is opened.
      - name: Compile FemboyGram and ExteraGram application sources
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppStandalone:compileFemboygramAfatDebugJavaWithJavac \
            :TMessagesProj_AppStandalone:compileExteragramAfatDebugJavaWithJavac

      - name: Compile Extera instrumentation tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppTests:compileAfatDebugAndroidTestJavaWithJavac \
            :TMessagesProj_AppTests:compileAfatDebugAndroidTestKotlin

  build:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FEMBOYGRAM_API_ID: ${{ secrets.FEMBOYGRAM_API_ID }}
      FEMBOYGRAM_API_HASH: ${{ secrets.FEMBOYGRAM_API_HASH }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Assemble both editions
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppStandalone:assembleFemboygramAfatDebug \
            :TMessagesProj_AppStandalone:assembleExteragramAfatDebug

      - name: Stage clearly named APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          found_femboygram=false
          found_exteragram=false
          while IFS= read -r -d '' apk; do
            package_info="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
            if grep -q "package: name='com.femboygram.messenger'" <<< "$package_info"; then
              cp "$apk" dist/FemboyGram-debug.apk
              found_femboygram=true
            elif grep -q "package: name='com.exteragram.messenger'" <<< "$package_info"; then
              cp "$apk" dist/ExteraGram-debug.apk
              found_exteragram=true
            fi
          done < <(find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -print0)
          test "$found_femboygram" = true
          test "$found_exteragram" = true
          test -s dist/FemboyGram-debug.apk
          test -s dist/ExteraGram-debug.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: femboygram-and-exteragram-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
