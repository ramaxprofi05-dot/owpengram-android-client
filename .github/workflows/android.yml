name: FemboyGram + ExteraGram Android

on:
  push:
    branches: [femboygram, feature/profile-banners]
    paths:
      - '**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Разрешить сборку APK (только после завершения разработки)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dual-edition-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-both-editions:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FEMBOYGRAM_API_ID: ${{ secrets.FEMBOYGRAM_API_ID }}
      FEMBOYGRAM_API_HASH: ${{ secrets.FEMBOYGRAM_API_HASH }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android compile toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # Compile both app variants and the existing instrumentation-test sources.
      # This does not assemble, package, sign, or upload an APK.
      - name: Compile FemboyGram and ExteraGram Java sources
        run: |
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_AppStandalone:compileFemboygramAfatDebugJavaWithJavac \
            :TMessagesProj_AppStandalone:compileExteragramAfatDebugJavaWithJavac \
            :TMessagesProj_AppTests:compileAfatDebugAndroidTestJavaWithJavac \
            :TMessagesProj_AppTests:compileAfatDebugAndroidTestKotlin

  build:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FEMBOYGRAM_API_ID: ${{ secrets.FEMBOYGRAM_API_ID }}
      FEMBOYGRAM_API_HASH: ${{ secrets.FEMBOYGRAM_API_HASH }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build FemboyGram debug APK
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleFemboygramAfatDebug

      - name: Build ExteraGram debug APK
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleExteragramAfatDebug

      - name: Upload FemboyGram debug APK
        uses: actions/upload-artifact@v4
        with:
          name: femboygram-android-debug
          path: TMessagesProj_AppStandalone/build/outputs/apk/femboygramAfat/debug/app.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ExteraGram debug APK
        uses: actions/upload-artifact@v4
        with:
          name: exteragram-android-debug
          path: TMessagesProj_AppStandalone/build/outputs/apk/exteragramAfat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
